[project]
name = "skilltrack-research"
version = "0.1.0"
description = "Scripts de investigación de SkillTrack-Piano (concordancia, clasificador, validaciones)"
requires-python = "==3.12.*"
dependencies = [
    "numpy==2.5.4",
    "onnxruntime==1.31.1",
    "scikit-learn==1.9.1",
    "skl2onnx==1.20.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
