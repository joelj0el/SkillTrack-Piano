# Solo para la E2E del pago por QR con el banco: un servidor FALSO del banco, nunca el real.
# Uso: docker compose -p skilltrack-e2e -f infra/docker-compose.yml -f infra/docker-compose.banco-falso.yml up -d --build
# y luego E2E_BANECO=1 pnpm e2e e2e/baneco.spec.ts. Credenciales SINTÉTICAS de prueba.
x-banco-falso: &credenciales
  BANECO_API_URL: http://banco-falso:8080/ApiGateway/
  BANECO_USUARIO: usuario-e2e
  BANECO_CONTRASENA: contrasena-e2e
  BANECO_CUENTA: "1234567890"
  BANECO_LLAVE_AES: 0123456789ABCDEF0123456789ABCDEF

services:
  api:
    environment:
      <<: *credenciales
      PAGOS_PROVEEDOR: baneco
    depends_on:
      banco-falso:
        condition: service_started

  banco-falso:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    command: ["python", "-m", "tests.banco_falso"]
    environment: *credenciales
    volumes:
      - ../apps/api/tests:/app/tests:ro
    ports:
      - "127.0.0.1:18080:8080"
