[project]
name = "skilltrack-api"
version = "0.1.0"
description = "API de SkillTrack-Piano"
requires-python = "==3.12.*"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "datamodel-code-generator==0.86.0",
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.17.3",
    "testcontainers[postgres]==4.15.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["app/contracts_gen"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
