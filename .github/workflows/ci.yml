name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      # Las pruebas de los esqueletos docs:* ejecutan scripts de Python con uv.
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm deps:check
      - run: pnpm design:contraste
      - run: pnpm docs:ids
      # Los scripts de tools/docs y tools/catalogo son scripts uv sueltos: se revisan con el ruff de la API.
      - run: uvx ruff@0.17.3 check --config apps/api/pyproject.toml tools/docs tools/catalogo
      - run: uvx ruff@0.17.3 format --check --config apps/api/pyproject.toml tools/docs tools/catalogo
      - run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/vitest.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-typescript
          path: reports/
          retention-days: 14

  python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run lint-imports
      - run: uv run pytest --junitxml=../../reports/pytest-api.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-python
          path: reports/
          retention-days: 14

  research-python:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: research/python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest --junitxml=../../reports/pytest-research.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-research-python
          path: reports/
          retention-days: 14

  contratos:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
      - run: pnpm install --frozen-lockfile
      - run: uv sync --locked --project apps/api
      - run: pnpm contracts:gen
      - name: Los contratos generados coinciden con los versionados
        run: git diff --exit-code
      - name: No hay archivos generados sin versionar
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"

  # Privacidad (ningún medio sale del dispositivo), tempo fuera de rango y accesibilidad: bloquean el PR.
  e2e-bloqueantes:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Levantar el sistema completo
        run: docker compose -f infra/docker-compose.yml up -d --build --wait
      - name: Esperar a la API
        run: |
          for _ in $(seq 1 60); do
            curl -skf https://localhost/api/health && exit 0
            sleep 2
          done
          exit 1
      - name: E2E bloqueantes
        run: >-
          pnpm e2e e2e/hu03.spec.ts e2e/hu08.spec.ts e2e/hu10.spec.ts e2e/hu11.spec.ts
          e2e/hu20.spec.ts e2e/accesibilidad.spec.ts
      - name: Registros del sistema si falla
        if: failure()
        run: docker compose -f infra/docker-compose.yml logs --tail 200
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: e2e-bloqueantes
          path: |
            reports/
            test-results/
          retention-days: 14
